<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f6f1e7" />
  <meta name="description" content="BiblioLingo — Aprende idiomas leyendo, oyendo y estudiando la Biblia, la Palabra de Dios." />
  <title>BiblioLingo — La Biblia en tu idioma</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icon-180.png" />
  <link rel="stylesheet" href="css/style.css?v=52" />
</head>
<body>
  <header class="topbar">
    <div class="nav-group">
      <button id="prevBtn" class="nav-arrow" title="Capítulo anterior" aria-label="Capítulo anterior">‹</button>
      <button id="navTitle" class="nav-title" aria-haspopup="dialog" aria-label="Elegir libro y capítulo">BiblioLingo</button>
      <button id="nextBtn" class="nav-arrow" title="Capítulo siguiente" aria-label="Capítulo siguiente">›</button>
    </div>
    <div class="menu-wrap">
      <button id="moreBtn" class="more-btn" title="Más opciones" aria-label="Más opciones" aria-haspopup="true" aria-expanded="false"><span data-icon="dots"></span></button>
      <div class="menu" id="moreMenu" role="menu" aria-label="Opciones">
        <button id="readBtn" class="menu-item" role="menuitem"><span class="mi-ico" data-icon="play"></span><span>Escuchar</span></button>
        <button id="vocabBtn" class="menu-item" role="menuitem"><span class="mi-ico" data-icon="star"></span><span>Vocabulario</span></button>
        <button id="aiBtn" class="menu-item" role="menuitem"><span class="mi-ico" data-icon="sparkles"></span><span>Pregunta a la IA</span></button>
        <hr>
        <div class="menu-label">Tamaño de texto</div>
        <div class="menu-seg" role="group" aria-label="Tamaño del texto">
          <button id="fontDecBtn" title="Texto más pequeño" aria-label="Texto más pequeño">A−</button>
          <button id="fontIncBtn" title="Texto más grande" aria-label="Texto más grande">A+</button>
        </div>
        <hr>
        <label class="menu-lang"><span class="menu-lang-title"><span class="mi-ico" data-icon="globe"></span><span>Idioma</span></span><select id="langSelect" class="lang-select" aria-label="Idioma"></select></label>
        <button id="themeBtn" class="menu-item" role="menuitem"><span class="mi-ico" data-icon="moon"></span><span>Tema</span></button>
      </div>
    </div>
  </header>

  <div id="loading" class="loading" hidden>Cargando la Biblia…
    <div class="loading-skel" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i></div>
  </div>

  <main class="layout">
    <section class="reader">
      <h1 id="chapterTitle"></h1>
      <div id="verseText" class="verse-text"></div>
    </section>

    <aside class="panel" id="lookupPanel">
      <div class="grabber" aria-hidden="true"></div>
      <div class="panel-head">
        <span id="panelTitle" class="panel-title">Traducción</span>
        <span class="panel-head-spacer"></span>
        <button id="panelCloseBtn" class="icon-btn" title="Cerrar" aria-label="Cerrar">✕</button>
      </div>
      <div class="panel-body">
        <div id="wordContent">
          <div class="word-head">
            <div class="word-title-row">
              <h2 id="wordLabel"></h2>
              <button id="speakBtn" class="round-btn" title="Escuchar pronunciación" disabled><span data-icon="volume"></span></button>
            </div>
            <div class="word-actions">
              <button id="ctxBtn" class="ghost-btn" title="Traducción en línea de esta palabra o frase"><span class="btn-ico" data-icon="globe"></span>Traducción</button>
              <button id="wordAiBtn" class="ghost-btn" title="Preguntáselo a la IA"><span class="btn-ico" data-icon="sparkles"></span>IA</button>
            </div>
          </div>
          <div id="ctxWrap" class="ctx-wrap" hidden>
            <div id="ctxResult" class="ctx-result"></div>
          </div>
          <div id="meaning" class="meaning"></div>
          <div id="grammar" class="grammar"></div>
          <button id="saveBtn" class="primary-btn" disabled>Guardar en el vocabulario</button>
          <div id="note" class="note"></div>
        </div>
        <div id="vocabContent" hidden>
          <div class="vocab-scope">
            <div class="seg" role="group" aria-label="Ámbito">
              <button id="scopeAll" class="seg-btn on">Todos</button>
              <button id="scopeChapter" class="seg-btn">Este capítulo</button>
            </div>
            <div id="vocabCount" class="vocab-count"></div>
          </div>
          <button id="studyBtn" class="primary-btn">Estudiar</button>
          <ul id="vocabList" class="vocab-list"></ul>
        </div>
        <div id="studyContent" hidden>
          <div class="study-head">
            <button id="studyBack" class="ghost-btn">← Vocabulario</button>
            <span id="studyTitle" class="study-title"></span>
            <button id="studySpeak" class="round-btn" title="Escuchar"><span data-icon="volume"></span></button>
            <span id="studyProgress" class="study-progress"></span>
          </div>
          <div id="studyCard" class="study-card" role="button" tabindex="0" aria-label="Tarjeta de estudio, toca para ver el significado">
            <div id="studyWord" class="study-word"></div>
            <div id="studyMeaning" class="study-meaning" hidden></div>
            <div id="studyGram" class="study-gram" hidden></div>
            <div id="studyHint" class="study-hint">Toca la tarjeta</div>
          </div>
          <div id="studyControls" class="study-controls" hidden>
            <button id="studyAgain" class="ghost-btn">↻ Repasar</button>
            <button id="studyKnow" class="primary-btn"><span class="btn-ico" data-icon="check"></span>Lo sabía</button>
          </div>
          <div id="studyDone" class="study-done" hidden>
            <div id="studyDoneMsg" class="study-done-msg">¡Lo has repasado todo!</div>
            <button id="studyRestart" class="primary-btn">Empezar otra vez</button>
          </div>
        </div>
        <div id="aiContent" hidden>
          <div class="ai-intro">
            <p class="ai-tip">Toca una palabra del texto y vendrá aquí, o escribe tu pregunta. La IA responde en español sencillo con su traducción al lado.</p>
          </div>
          <div id="aiThread" class="ai-thread"></div>
          <div class="ai-compose">
            <textarea id="aiInput" rows="2" placeholder="Ej. ¿Por qué «étaient» está en pasado? / Explícame esta frase."></textarea>
            <div class="ai-actions">
              <button id="aiLocalBtn" class="ghost-btn" title="Explicación del diccionario, sin conexión"><span class="btn-ico" data-icon="book"></span>Local</button>
              <button id="aiSendBtn" class="primary-btn">Preguntar <span class="btn-ico" data-icon="sparkles"></span></button>
            </div>
          </div>
        </div>
        </div>
      </div>
    </aside>
    <aside class="panel nav-sheet" id="navSheet" role="dialog" aria-label="Elegir libro y capítulo" aria-hidden="true">
      <div class="grabber" aria-hidden="true"></div>
      <div class="panel-head">
        <span class="panel-title">Libro y capítulo</span>
        <span class="panel-head-spacer"></span>
        <button id="navSheetClose" class="icon-btn" title="Cerrar" aria-label="Cerrar">✕</button>
      </div>
      <div class="panel-body nav-sheet-body" id="navSheetBody"></div>
    </aside>
    <div class="scrim" id="scrim"></div>
  </main>

  <div id="readerBar" class="reader-bar" hidden>
    <div class="rb-progress"><i id="rbFill"></i></div>
    <div class="rb-body">
      <div class="rb-info">
        <span id="rbTitle" class="rb-title">Capítulo</span>
        <span id="rbVerse" class="rb-verse">—</span>
      </div>
      <div class="rb-controls">
        <button id="rbPrev" class="icon-btn" title="Verso anterior" aria-label="Verso anterior"><span data-icon="prev"></span></button>
        <button id="rbPlay" class="round-btn" title="Reproducir / pausar" aria-label="Reproducir o pausar"><span data-icon="play"></span></button>
        <button id="rbNext" class="icon-btn" title="Verso siguiente" aria-label="Verso siguiente"><span data-icon="next"></span></button>
        <button id="rbStop" class="icon-btn" title="Detener" aria-label="Detener"><span data-icon="stop"></span></button>
      </div>
      <div class="rb-right">
        <button id="rbSpeed" class="speed-btn" title="Elegir velocidad de lectura" aria-label="Elegir velocidad de lectura">1.0×</button>
        <button id="rbClose" class="icon-btn" title="Cerrar" aria-label="Cerrar">✕</button>
      </div>
    </div>
    <div id="rbSpeedMenu" class="rb-speed-menu" hidden>
      <div class="rb-speed-label">Velocidad de lectura</div>
      <div id="rbSpeedOptions" class="rb-speed-options"></div>
    </div>
  </div>

  <script type="module" src="js/app.js?v=56"></script>

  <script>
    // Non-module trap (runs even if the module above fails to load or parse).
    // Module load failures fire "error" on the <script> element; module
    // evaluation errors surface as window "error" / "unhandledrejection".
    (function () {
      var m = document.querySelector("script[type=module]");
      function show(kind, msg) {
        var l = document.getElementById("loading");
        if (!l) return;
        l.hidden = false;
        var div = document.createElement("p");
        div.style.color = "#e05252";
        div.textContent = kind + ": " + msg;
        l.appendChild(div);
      }
      if (m) {
        m.addEventListener("error", function (ev) {
          show("MÓDULO NO CARGÓ", ev.message || "no se pudo descargar js/app.js");
        });
      }
      window.addEventListener("error", function (ev) {
        if (typeof __APP_BOOTED__ !== "undefined") return;
        show("ERROR JS", ev.message || String(ev.error || ev.reason || ev));
      });
      window.addEventListener("unhandledrejection", function (ev) {
        if (typeof __APP_BOOTED__ !== "undefined") return;
        show("PROMESA RECHAZADA", (ev.reason && ev.reason.message) || String(ev.reason));
      });
    })();
  </script>

  <script>
    // Last-resort watchdog: if the module above never booted (old cached HTML
    // paired with the new JS, a parse failure, etc.) the loading screen would
    // sit forever. Detect that and offer a cache wipe + reload.
    setTimeout(function () {
      if (window.__APP_BOOTED__) return;
      var l = document.getElementById("loading");
      if (!l) return;
      l.hidden = false;
      var p = document.createElement("p");
      p.textContent = "La app no pudo iniciarse (posible versión antigua en caché).";
      var b = document.createElement("button");
      b.textContent = "Borrar caché y recargar";
      b.className = "primary-btn";
      b.addEventListener("click", async function () {
        try {
          if ("serviceWorker" in navigator) {
            var regs = await navigator.serviceWorker.getRegistrations();
            await Promise.all(regs.map(function (r) { return r.unregister(); }));
          }
          if ("caches" in window) {
            var keys = await caches.keys();
            await Promise.all(keys.map(function (k) { return caches.delete(k); }));
          }
        } catch (e) {}
        location.reload();
      });
      l.appendChild(p);
      l.appendChild(b);
    }, 15000);
  </script>
</body>
</html>
