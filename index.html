<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#f6f1e7" />
  <title>Bible en français — Español</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icon-180.png" />
  <link rel="stylesheet" href="css/style.css?v=24" />
</head>
<body>
  <header class="topbar">
    <div class="topbar-title">
      <span class="brand">📖</span>
      <span>Bible en français</span>
    </div>
    <div class="topbar-controls">
      <select id="bookSelect" aria-label="Libro"></select>
      <button id="prevBtn" title="Capítulo anterior">‹</button>
      <select id="chapterSelect" aria-label="Capítulo"></select>
      <button id="nextBtn" title="Capítulo siguiente">›</button>
      <button id="vocabBtn" title="Ver vocabulario">⭐</button>
      <button id="themeBtn" title="Cambiar tema">🌙</button>
      <button id="aiBtn" title="Preguntar a la IA">✨</button>
    </div>
  </header>

  <div id="loading" class="loading">Cargando la Biblia…</div>

  <main class="layout">
    <section class="reader">
      <h1 id="chapterTitle"></h1>
      <div id="verseText" class="verse-text"></div>
    </section>

    <aside class="panel" id="lookupPanel">
      <div class="grabber" aria-hidden="true"></div>
      <div class="panel-head">
        <span id="panelTitle" class="panel-title">Traducción</span>
        <button id="panelCloseBtn" class="icon-btn" title="Cerrar" aria-label="Cerrar">✕</button>
      </div>
      <div class="panel-body">
        <div id="wordContent">
          <div class="word-head">
            <div class="word-title-row">
              <h2 id="wordLabel"></h2>
              <button id="speakBtn" class="round-btn" title="Escuchar pronunciación" disabled>🔊</button>
            </div>
            <div class="word-actions">
              <button id="ctxBtn" class="ghost-btn" title="Traducción en línea de esta palabra o frase">🌐 Traducción</button>
              <button id="wordAiBtn" class="ghost-btn" title="Preguntáselo a la IA">✨ IA</button>
            </div>
          </div>
          <div id="ctxWrap" class="ctx-wrap" hidden>
            <div id="ctxResult" class="ctx-result"></div>
          </div>
          <div id="meaning" class="meaning"></div>
          <div id="grammar" class="grammar"></div>
          <button id="saveBtn" class="primary-btn" disabled>Guardar en el vocabulario</button>
          <div id="note" class="note"></div>
        </div>
        <div id="vocabContent" hidden>
          <div class="vocab-scope">
            <div class="seg" role="group" aria-label="Ámbito">
              <button id="scopeAll" class="seg-btn on">Todos</button>
              <button id="scopeChapter" class="seg-btn">Este capítulo</button>
            </div>
            <div id="vocabCount" class="vocab-count"></div>
          </div>
          <button id="studyBtn" class="primary-btn">Estudiar</button>
          <ul id="vocabList" class="vocab-list"></ul>
        </div>
        <div id="studyContent" hidden>
          <div class="study-head">
            <button id="studyBack" class="ghost-btn">← Vocabulario</button>
            <span id="studyTitle" class="study-title"></span>
            <button id="studySpeak" class="round-btn" title="Escuchar">🔊</button>
            <span id="studyProgress" class="study-progress"></span>
          </div>
          <div id="studyCard" class="study-card" role="button" tabindex="0" aria-label="Tarjeta de estudio, toca para ver el significado">
            <div id="studyWord" class="study-word"></div>
            <div id="studyMeaning" class="study-meaning" hidden></div>
            <div id="studyGram" class="study-gram" hidden></div>
            <div id="studyHint" class="study-hint">Toca la tarjeta</div>
          </div>
          <div id="studyControls" class="study-controls" hidden>
            <button id="studyAgain" class="ghost-btn">↻ Repasar</button>
            <button id="studyKnow" class="primary-btn">✓ Lo sabía</button>
          </div>
          <div id="studyDone" class="study-done" hidden>
            <div id="studyDoneMsg" class="study-done-msg">¡Lo has repasado todo!</div>
            <button id="studyRestart" class="primary-btn">Empezar otra vez</button>
          </div>
        </div>
        <div id="aiContent" hidden>
          <div class="ai-intro">
            <p class="ai-tip">Toca una palabra del texto y vendrá aquí, o escribe tu pregunta. La IA responde en español sencillo con su traducción al lado.</p>
          </div>
          <div id="aiThread" class="ai-thread"></div>
          <div class="ai-compose">
            <textarea id="aiInput" rows="2" placeholder="Ej. ¿Por qué «étaient» está en pasado? / Explícame esta frase."></textarea>
            <div class="ai-actions">
              <button id="aiLocalBtn" class="ghost-btn" title="Explicación del diccionario, sin conexión">📖 Local</button>
              <button id="aiSendBtn" class="primary-btn">Preguntar ✨</button>
            </div>
          </div>
        </div>
        </div>
      </div>
    </aside>
    <div class="scrim" id="scrim"></div>
  </main>

  <script type="module" src="js/app.js?v=24"></script>
</body>
</html>
